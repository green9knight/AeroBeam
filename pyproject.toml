[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerobeam"
version = "0.1.0"
description = "Preliminary wing spar sizing tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AeroBeam contributors" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.scripts]
aerobeam = "aerobeam.cli:main"

[tool.setuptools.packages.find]
include = ["aerobeam*"]
